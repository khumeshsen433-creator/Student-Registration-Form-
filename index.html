<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title></head>
<body>
<h1>Student Registration Form</h1>
<form>

    <label for="name">
        Student Name:
    </label>

    <input
        type="text"
        id="name"
        name="name">

    <br><br>

    <label for="email">
        Email:
    </label>

    <input
        type="email"
        id="email"
        name="email">

    <br><br>

    <label for="password">
        Password:
    </label>

    <input
        type="password"
        id="password"
        name="password">

    <br><br>

    <strong>Gender:</strong>

    <input
        type="radio"
        id="male"
        name="gender"
        value="Male">

    <label for="male">
        Male
    </label>

    <input
        type="radio"
        id="female"
        name="gender"
        value="Female">

    <label for="female">
        Female
    </label>

    <br><br>

    <label for="course">
        Course:
    </label>

    <select id="course" name="course">

        <option value="BCA">BCA</option>

        <option value="BTech">
            B.Tech
        </option>

        <option value="MCA">MCA</option>

    </select>

    <br><br>

    <strong>Skills:</strong>

    <input
        type="checkbox"
        id="html"
        name="skills"
        value="HTML">

    <label for="html">HTML</label>

    <input
        type="checkbox"
        id="python"
        name="skills"
        value="Python">

    <label for="python">
        Python
    </label>

    <br><br>

    <label for="address">
        Address:
    </label>

    <br>

    <textarea
        id="address"
        name="address"
        rows="5"
        cols="40">
    </textarea>

    <br><br>

    <input
        type="submit"
        value="Register">

    <input
        type="reset"
        value="Reset">
</form>
</body></html>
